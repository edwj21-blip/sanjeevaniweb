{% extends "base.html" %}
{% load i18n %}
{% block title %}500 – {% trans "Server Error" %} | Sanjeevani{% endblock %}
{% block content %}
<div class="container py-5 text-center" style="min-height:60vh;display:flex;align-items:center;justify-content:center;">
  <div>
    <div style="font-size:6rem;color:#c0392b;">
      <i class="bi bi-exclamation-triangle-fill"></i>
    </div>
    <h1 class="display-3 fw-bold text-danger mt-3">500</h1>
    <h3 class="mb-3">{% trans "Something Went Wrong" %}</h3>
    <p class="text-muted mb-4">{% trans "An internal server error occurred. Please try again later." %}</p>
    <a href="{% url 'core:home' %}" class="btn sj-btn-primary btn-lg">
      <i class="bi bi-house-fill me-2"></i>{% trans "Go to Homepage" %}
    </a>
  </div>
</div>
{% endblock %}
