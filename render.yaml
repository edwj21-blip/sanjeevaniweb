databases:
  - name: sanjeevani-db
    plan: free
    databaseName: sanjeevani
    user: sanjeevani

services:
  - type: web
    name: sanjeevani
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn sanjeevaniweb.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DATABASE_URL
        fromDatabase:
          name: sanjeevani-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
